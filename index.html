<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Henriette - Les Lumières de la Rue</title>
    <link rel="stylesheet" href="Style/style.css">
</head>

<body>

    <div id="status">Génération en cours...</div>
    <canvas id="maze"></canvas>

    <div id="controls">
        <button onclick="move(0,-1)">▲</button>
        <div>
            <button onclick="move(-1,0)">◀</button>
            <button onclick="move(1,0)">▶</button>
        </div>
        <button onclick="move(0,1)">▼</button>
    </div>
    
    <div>
        <button onclick="choixNiv('facile')">Facile</button>
        <button onclick="choixNiv('moyen')">Moyen</button>
        <button onclick="choixNiv('difficile')">Difficile</button>
    </div>
    <button onclick="newMaze()" id="btn" disabled>Nouveau labyrinthe</button>

    <script src="JavaScript/script.js"></script>
</body>

</html>
