<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Henriette - Les Lumières de la Rue</title>
    <link rel="stylesheet" href="Style/style.css">
</head>

<body>

    <!-- Page de début -->
    <div id="screen-start">
        <h1>🌀 Labyrinthe</h1>
        <img src="illustration.png" alt="labyrinthe" id="illus">
        <div id="niveau-start">
            <button id="start-facile">Facile</button>
            <button id="start-moyen">Moyen</button>
            <button id="start-difficile">Difficile</button>
        </div>
        <button id="btn-jouer">Jouer</button>
    </div>

    <div id="status">Génération en cours...</div>
    <div id="chrono">00:00</div>
    <canvas id="maze"></canvas>

    <div id="controls">
        <div id="btn-up"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <path d="M16 12l-4-4-4 4M12 16V9" />
            </svg></div>
        <div>
            <div id="btn-left"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 8l-4 4 4 4M16 12H9" />
                </svg></div>
            <div id="btn-right"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 8l4 4-4 4M8 12h7" />
                </svg></div>
        </div>
        <div id="btn-down"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <path d="M16 12l-4 4-4-4M12 8v7" />
            </svg></div>
    </div>

    <div id="niveau">
        <button id="btn-facile">Facile</button>
        <button id="btn-moyen">Moyen</button>
        <button id="btn-difficile">Difficile</button>
    </div>


    <!-- Page de fin -->
    <div id="screen-end" class="hidden">
        <h2>🎉 Bravo !</h2>
        <p id="end-temps"></p>
        <button id="btn-rejouer">Rejouer</button>
    </div>


    <script src="JavaScript/script.js"></script>
</body>

</html>
